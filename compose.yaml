services:
  api:
    build: .
    image: localhost/dashhook/api:2.3.0
    container_name: dashhook-api
    restart: unless-stopped
    network_mode: host

    env_file:
      - .env

    environment:
      - PYTHONPATH=/app:/app/app
      - REDIS_HOST=127.0.0.1

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1

    depends_on:
      - redis

    stop_grace_period: 20s

  worker:
    build: .
    image: localhost/dashhook/worker:2.3.0
    container_name: dashhook-worker
    restart: unless-stopped
    network_mode: host

    env_file:
      - .env

    environment:
      - PYTHONPATH=/app:/app/app
      - REDIS_HOST=127.0.0.1

    command: arq app.worker.WorkerSettings

    depends_on:
      - redis

    stop_grace_period: 30s

  report_worker:
    build: .
    image: localhost/dashhook/api:2.3.0
    container_name: dashhook-report-worker
    restart: unless-stopped
    network_mode: host

    env_file:
      - .env

    environment:
      - PYTHONPATH=/app:/app/app
      - REDIS_HOST=127.0.0.1

    command: arq app.report_worker.ReportWorkerSettings

    depends_on:
      - redis

    stop_grace_period: 30s

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: dashhook-redis
    restart: unless-stopped

    # Só na loopback: api/workers rodam com network_mode: host e acessam via
    # 127.0.0.1. Publicar em 0.0.0.0 sem senha deixa o Redis aberto pra
    # internet (scanners rodam REPLICAOF/CONFIG SET e derrubam a fila).
    ports:
      - "127.0.0.1:6379:6379"

    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}",
        "--protected-mode", "yes",
        "--save", "60", "1",
        "--loglevel", "notice",
        "--shutdown-timeout", "30"
      ]

    volumes:
      - ${REDIS_VOLUME:-redis_data}:/data:Z

    stop_grace_period: 40s

volumes:
  redis_data: