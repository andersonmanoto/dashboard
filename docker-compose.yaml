services:
  api:
    build: .
    container_name: dashhook-api
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

  worker:
    build: .
    container_name: dashhook-worker
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/app
    volumes:
      - .:/app
    command: python -m app.worker
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "5"
